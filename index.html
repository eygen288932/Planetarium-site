<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planetarium 1:1 — Windows .exe</title>
<meta name="description" content="Planetarium 1:1 — Solar System at real scale. Native Windows .exe on Electron.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #02040a;
    --bg-2: #0a0e1f;
    --panel: rgba(14, 20, 36, 0.6);
    --border: rgba(127, 180, 255, 0.18);
    --border-strong: rgba(127, 180, 255, 0.4);
    --fg: #e8ecf4;
    --dim: #9fb0cc;
    --accent: #7fb4ff;
    --green: #5ee0a0;
    --purple: #b28dff;
    --yellow: #ffd24a;
    --windows: #00a4ef;
    --youtube: #ff3d3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 'Space Grotesk', system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .nebula {
    position: fixed; inset: -10%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 600px 500px at 15% 20%, rgba(60, 90, 200, 0.18), transparent 60%),
      radial-gradient(ellipse 700px 600px at 85% 70%, rgba(140, 60, 180, 0.14), transparent 60%),
      radial-gradient(ellipse 800px 500px at 50% 100%, rgba(255, 120, 60, 0.08), transparent 60%),
      radial-gradient(ellipse 400px 300px at 70% 15%, rgba(127, 180, 255, 0.10), transparent 60%);
    filter: blur(20px);
    animation: nebulaFloat 30s ease-in-out infinite alternate;
  }
  @keyframes nebulaFloat {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-20px, 10px) scale(1.05); }
  }
  .vignette {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 30%, transparent 20%, rgba(2, 4, 10, 0.7) 100%);
  }
  main, header, footer { position: relative; z-index: 1; }

  header {
    position: sticky; top: 0; z-index: 10;
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    backdrop-filter: blur(12px);
    background: rgba(2, 4, 10, 0.55);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700; letter-spacing: 0.15em; font-size: 14px;
    color: var(--fg);
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent), 0 0 24px rgba(127, 180, 255, 0.4);
    animation: logoPulse 2s ease-in-out infinite;
  }
  @keyframes logoPulse { 50% { opacity: 0.5; transform: scale(0.85); } }
  .header-right { display: flex; align-items: center; gap: 22px; }
  header nav { display: flex; gap: 18px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; }
  header nav a { color: var(--dim); text-decoration: none; transition: color 0.2s; white-space: nowrap; }
  header nav a:hover { color: var(--fg); }
  .lang-select {
    background: rgba(20, 27, 44, 0.7);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font: inherit; font-size: 13px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    flex-shrink: 0;
  }
  .lang-select:hover, .lang-select:focus {
    border-color: var(--border-strong);
    background: rgba(30, 40, 60, 0.9);
    outline: none;
  }

  .hero {
    max-width: 1280px; margin: 0 auto;
    padding: 60px 32px 80px;
    display: grid; grid-template-columns: 1.1fr 1fr; gap: 60px; align-items: center;
    min-height: calc(100vh - 70px);
  }
  .hero-content { max-width: 640px; }
  .version-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 100px;
    background: rgba(94, 224, 160, 0.08);
    border: 1px solid rgba(94, 224, 160, 0.35);
    color: var(--green);
    font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 24px;
  }
  .version-badge::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px var(--green);
    animation: logoPulse 2s ease-in-out infinite;
  }
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900; font-size: clamp(38px, 6.5vw, 84px); line-height: 0.95; letter-spacing: -0.01em;
    margin: 0 0 24px;
    background: linear-gradient(135deg, #ffffff 0%, #c9d8ff 40%, #7fb4ff 70%, #ffd9a0 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  h1 span {
    display: block; font-size: 0.4em; letter-spacing: 0.3em;
    color: var(--accent); -webkit-text-fill-color: var(--accent);
    margin-top: 12px; font-weight: 500;
  }
  .tagline { font-size: clamp(15px, 1.3vw, 18px); color: var(--dim); margin: 0 0 32px; max-width: 560px; }
  .tagline strong { color: var(--fg); font-weight: 600; }

  .cta-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 28px; border-radius: 12px;
    font: inherit; font-weight: 600; font-size: 15px;
    text-decoration: none; cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid transparent;
  }
  .btn-primary {
    background: linear-gradient(135deg, #7fb4ff, #4a7fe0); color: #02040a;
    box-shadow: 0 0 0 0 rgba(127, 180, 255, 0.5), 0 8px 30px rgba(74, 127, 224, 0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 0 4px rgba(127, 180, 255, 0.15), 0 12px 40px rgba(74, 127, 224, 0.5); }
  .btn-primary svg { width: 18px; height: 18px; }
  .btn-secondary { background: rgba(20, 27, 44, 0.7); color: var(--fg); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--border-strong); background: rgba(30, 40, 60, 0.9); transform: translateY(-2px); }
  .btn-youtube {
    background: rgba(255, 61, 61, 0.1); color: #ff8a8a;
    border-color: rgba(255, 61, 61, 0.35);
  }
  .btn-youtube:hover {
    background: rgba(255, 61, 61, 0.2); border-color: var(--youtube); color: #fff;
    transform: translateY(-2px); box-shadow: 0 0 0 4px rgba(255, 61, 61, 0.1);
  }
  .btn-youtube svg { width: 18px; height: 18px; }

  .trailer-note { display: inline-block; margin-top: 12px; font-size: 12px; color: var(--dim); opacity: 0.85; }
  .trailer-note .badge {
    display: inline-block;
    background: rgba(255, 61, 61, 0.12); color: #ff8a8a;
    border: 1px solid rgba(255, 61, 61, 0.3);
    padding: 1px 6px; border-radius: 4px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
    margin-right: 6px; text-transform: uppercase;
  }

  .hero-meta { margin-top: 28px; font-size: 13px; color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 100px;
    background: rgba(20, 27, 44, 0.6); border: 1px solid var(--border); color: var(--dim);
  }
  .pill strong { color: var(--fg); font-weight: 500; }
  .pill.vulkan { background: rgba(255, 60, 100, 0.07); border-color: rgba(255, 60, 100, 0.3); color: #ff8aa4; }
  .pill.vulkan strong { color: #ff8aa4; }
  .pill.windows { background: rgba(0, 164, 239, 0.08); border-color: rgba(0, 164, 239, 0.35); color: #7fc6ff; }
  .pill.windows strong { color: #7fc6ff; }

  .orbit-visual { position: relative; width: 100%; aspect-ratio: 1; max-width: 520px; margin: 0 auto; }
  .orbit-visual::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(127, 180, 255, 0.06), transparent 60%);
    border-radius: 50%;
  }
  .sun-center {
    position: absolute; top: 50%; left: 50%;
    width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff6c8, #ffb53d 55%, #e8730c 90%);
    box-shadow:
      0 0 30px 8px rgba(255, 170, 60, 0.55),
      0 0 60px 20px rgba(255, 120, 30, 0.25),
      0 0 100px 40px rgba(255, 90, 30, 0.10);
    animation: sunPulse 3s ease-in-out infinite;
    z-index: 3;
  }
  @keyframes sunPulse { 50% { transform: scale(1.06); } }
  .orbit {
    position: absolute; top: 50%; left: 50%;
    border-radius: 50%; border: 1px solid rgba(127, 180, 255, 0.15);
    transform: translate(-50%, -50%);
    animation: orbitSpin linear infinite;
  }
  .orbit::after { content: ''; position: absolute; inset: -1px; border-radius: 50%; box-shadow: inset 0 0 30px rgba(127, 180, 255, 0.05); }
  @keyframes orbitSpin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }
  .planet {
    position: absolute; top: 50%; left: 0;
    border-radius: 50%; transform: translate(-50%, -50%);
    box-shadow: inset -3px -3px 8px rgba(0,0,0,0.55), 0 0 10px rgba(255,255,255,0.15);
    animation: orbitSpin linear infinite reverse;
  }
  .orbit-1 { width: 130px; height: 130px; animation-duration: 10s; }
  .orbit-1 .planet { animation-duration: 10s; }
  .orbit-2 { width: 210px; height: 210px; animation-duration: 16s; animation-direction: reverse; }
  .orbit-2 .planet { animation-duration: 16s; }
  .orbit-3 { width: 310px; height: 310px; animation-duration: 24s; }
  .orbit-3 .planet { animation-duration: 24s; }
  .orbit-4 { width: 420px; height: 420px; animation-duration: 34s; animation-direction: reverse; }
  .orbit-4 .planet { animation-duration: 34s; }
  .p-mercury { width: 10px; height: 10px; background: radial-gradient(circle at 35% 35%, #b5a99b, #6e6a64); }
  .p-earth   { width: 16px; height: 16px; background: radial-gradient(circle at 35% 35%, #4a9ee8, #1f64b0 45%, #2f6b2c); }
  .p-jupiter { width: 26px; height: 26px; background: radial-gradient(circle at 35% 35%, #f4ead6, #c9764a 55%, #a86b4a); }
  .p-saturn  { width: 20px; height: 20px; background: radial-gradient(circle at 35% 35%, #f3e6c0, #bfa36a); }
  .p-saturn::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 40px; height: 8px; margin: -4px 0 0 -20px;
    border-radius: 50%; border: 1.5px solid rgba(232, 214, 164, 0.7); transform: rotate(-20deg);
  }

  .section { max-width: 1280px; margin: 0 auto; padding: 80px 32px; }
  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(24px, 3vw, 36px); font-weight: 700; letter-spacing: -0.01em;
    margin: 0 0 12px; color: var(--fg);
  }
  .section-sub { color: var(--dim); font-size: 16px; margin: 0 0 48px; max-width: 700px; }

  .trailer-section { max-width: 1280px; margin: 0 auto; padding: 0 32px 80px; }
  .trailer-card {
    position: relative;
    background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
    overflow: hidden; backdrop-filter: blur(8px);
    transition: all 0.25s ease;
  }
  .trailer-card:hover { border-color: rgba(255, 61, 61, 0.5); box-shadow: 0 0 40px rgba(255, 61, 61, 0.15); }
  .trailer-link {
    display: block; position: relative;
    aspect-ratio: 16 / 9;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(255, 61, 61, 0.15), transparent 60%),
      radial-gradient(ellipse at 70% 60%, rgba(127, 180, 255, 0.12), transparent 60%),
      linear-gradient(135deg, #0a0e1f 0%, #141b2c 100%);
    text-decoration: none; overflow: hidden; cursor: pointer;
  }
  .trailer-link::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,0.6), transparent),
      radial-gradient(2px 2px at 30% 90%, rgba(255,255,255,0.3), transparent),
      radial-gradient(2px 2px at 70% 30%, rgba(255,255,255,0.25), transparent);
    opacity: 0.8;
  }
  .trailer-play {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 88px; height: 88px;
    border-radius: 50%;
    background: rgba(255, 61, 61, 0.95);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 40px rgba(255, 61, 61, 0.5), 0 0 0 0 rgba(255, 61, 61, 0.4);
    transition: all 0.3s ease;
    animation: playPulse 2.5s ease-in-out infinite;
  }
  @keyframes playPulse {
    0%, 100% { box-shadow: 0 8px 40px rgba(255, 61, 61, 0.5), 0 0 0 0 rgba(255, 61, 61, 0.4); }
    50%      { box-shadow: 0 8px 40px rgba(255, 61, 61, 0.7), 0 0 0 20px rgba(255, 61, 61, 0); }
  }
  .trailer-play svg { width: 36px; height: 36px; margin-left: 5px; fill: #fff; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
  .trailer-link:hover .trailer-play { transform: translate(-50%, -50%) scale(1.1); background: #fff; }
  .trailer-link:hover .trailer-play svg { fill: var(--youtube); }
  .trailer-info {
    position: absolute; bottom: 20px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 16px; flex-wrap: wrap;
  }
  .trailer-info h3 {
    margin: 0;
    font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700;
    color: #fff; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9); letter-spacing: -0.01em;
  }
  .trailer-info .sub { margin: 4px 0 0; font-size: 13px; color: rgba(255, 255, 255, 0.75); text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9); }
  .trailer-info .version {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 6px;
    background: rgba(255, 61, 61, 0.85); color: #fff;
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; text-shadow: none; backdrop-filter: blur(4px);
  }

  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .feature {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; backdrop-filter: blur(8px);
    transition: all 0.25s ease;
  }
  .feature:hover { border-color: var(--border-strong); transform: translateY(-3px); background: rgba(20, 28, 48, 0.75); }
  .feature-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: rgba(127, 180, 255, 0.1); border: 1px solid rgba(127, 180, 255, 0.25);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px; color: var(--accent); font-size: 20px;
  }
  .feature h3 { font-size: 16px; margin: 0 0 6px; font-weight: 600; color: var(--fg); }
  .feature p { color: var(--dim); font-size: 14px; margin: 0; line-height: 1.5; }

  .tech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 8px; }
  .tech-card {
    background: linear-gradient(135deg, rgba(20, 28, 48, 0.7), rgba(14, 20, 36, 0.7));
    border: 1px solid var(--border); border-radius: 16px;
    padding: 22px 24px; backdrop-filter: blur(8px);
  }
  .tech-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); margin-bottom: 8px; }
  .tech-card .value { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 700; color: var(--fg); margin-bottom: 4px; }
  .tech-card .value.vulkan { color: #ff8aa4; }
  .tech-card .value.windows { color: #7fc6ff; }
  .tech-card .desc { font-size: 13px; color: var(--dim); line-height: 1.5; }

  .req-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .req-card {
    position: relative; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; backdrop-filter: blur(8px); overflow: hidden;
  }
  .req-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
  }
  .req-card.min::before  { background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  .req-card.rec::before  { background: linear-gradient(90deg, transparent, var(--green), transparent); }
  .req-card.max::before  { background: linear-gradient(90deg, transparent, var(--purple), transparent); }
  .req-card h4 {
    margin: 0 0 14px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
    font-family: 'Orbitron', sans-serif;
    display: flex; justify-content: space-between; align-items: center;
  }
  .req-card.min h4 { color: var(--accent); }
  .req-card.rec h4 { color: var(--green); }
  .req-card.max h4 { color: var(--purple); }
  .req-card h4 .level { font-size: 10px; color: var(--dim); font-weight: 500; letter-spacing: 0.05em; text-transform: none; }
  .req-card ul { list-style: none; padding: 0; margin: 0; font-size: 14px; color: var(--dim); }
  .req-card li { padding: 7px 0; display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed rgba(127, 180, 255, 0.08); line-height: 1.4; }
  .req-card li:last-child { border-bottom: none; }
  .req-card li > span:first-child { flex-shrink: 0; color: var(--dim); opacity: 0.85; }
  .req-card li strong { color: var(--fg); font-weight: 500; text-align: right; }
  .req-note {
    margin-top: 24px; padding: 16px 20px;
    background: rgba(0, 164, 239, 0.06); border: 1px solid rgba(0, 164, 239, 0.25);
    border-radius: 12px; font-size: 14px; color: var(--dim);
    display: flex; gap: 12px; align-items: flex-start; line-height: 1.55;
  }
  .req-note svg { flex-shrink: 0; color: var(--windows); margin-top: 2px; }

  .versions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
  .version-card {
    position: relative; background: var(--panel); border: 1px solid var(--border);
    border-radius: 20px; padding: 32px; backdrop-filter: blur(8px); overflow: hidden;
  }
  .version-card.stable {
    border-color: rgba(94, 224, 160, 0.35);
    background: linear-gradient(135deg, rgba(94, 224, 160, 0.05), rgba(14, 20, 36, 0.6));
  }
  .version-card.stable::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
  }
  .version-card.dev {
    border-color: rgba(255, 210, 74, 0.25);
    background: linear-gradient(135deg, rgba(255, 210, 74, 0.03), rgba(14, 20, 36, 0.6));
    opacity: 0.9;
  }
  .version-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 18px;
  }
  .version-tag.stable { background: rgba(94, 224, 160, 0.15); color: var(--green); border: 1px solid rgba(94, 224, 160, 0.3); }
  .version-tag.dev { background: rgba(255, 210, 74, 0.12); color: var(--yellow); border: 1px solid rgba(255, 210, 74, 0.3); }
  .version-num { font-family: 'Orbitron', sans-serif; font-size: 44px; font-weight: 900; letter-spacing: -0.02em; margin: 0 0 4px; color: var(--fg); line-height: 1; }
  .version-card.dev .version-num { color: var(--dim); }
  .version-subtitle { color: var(--dim); font-size: 14px; margin: 0 0 8px; }
  .version-platform { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); margin-bottom: 22px; }
  .version-features { list-style: none; padding: 0; margin: 0 0 28px; font-size: 14px; color: var(--dim); }
  .version-features li { padding: 6px 0; display: flex; align-items: flex-start; gap: 10px; }
  .version-features li::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0; margin-top: 8px;
  }
  .version-card.stable .version-features li::before { background: var(--green); }
  .version-card.dev .version-features li::before { background: var(--yellow); }
  .version-cta {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border-radius: 10px;
    font-weight: 600; font-size: 14px; text-decoration: none;
    transition: all 0.25s;
  }
  .version-cta.primary { background: var(--green); color: #02040a; }
  .version-cta.primary:hover { background: #7aecb8; transform: translateY(-2px); }
  .version-cta.locked {
    background: rgba(255, 210, 74, 0.08); color: var(--yellow);
    border: 1px solid rgba(255, 210, 74, 0.25);
    cursor: not-allowed; pointer-events: none;
  }
